<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ออกจากระบบ — Pegasus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a href="/upload" class="brand">
        <span class="brand-name">PEGASUS</span>
      </a>
    </div>
  </header>

  <div class="stub-banner" id="stub-banner" hidden>
    <div class="wrap">โหมดทดสอบ: ยังไม่ได้ตั้งค่า Google Vision ระบบใช้ตัวอ่านจำลอง ยอดที่อ่านได้ไม่ใช่ยอดจริงจากสลิป</div>
  </div>

  <main class="wrap main" id="main">
    <div class="narrow">
      <h1 class="page-title">ออกจากระบบ</h1>
      <p class="page-lede">ออกจากระบบทุกอุปกรณ์ที่เข้าสู่ระบบด้วยบัญชีนี้อยู่</p>
      <form method="post" action="/logout" class="card stack">
        <button type="submit" class="btn btn-primary btn-block">ออกจากระบบ</button>
      </form>
      <p class="mt small center"><a class="muted" href="/upload">ยกเลิก กลับไปหน้าส่งสลิป</a></p>
    </div>
  </main>

  <noscript>
    <p class="wrap notice notice-error">หน้านี้ต้องเปิด JavaScript</p>
  </noscript>
</body>
</html>
